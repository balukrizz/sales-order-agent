# Render Blueprint — deploys the FastAPI backend as an always-on web service.
services:
  - type: web
    name: po-sales-order-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: LLM_PROVIDER
        value: mock
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-large-latest
      - key: ENABLE_OCR
        value: "false"
      - key: DB_PATH
        value: /tmp/sales.db
      - key: FRONTEND_ORIGIN
        sync: false
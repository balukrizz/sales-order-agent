# Render Blueprint — deploys the FastAPI backend as an always-on web service.
# In the Render dashboard: New -> Blueprint -> point at this repo (root = backend/).
services:
  - type: web
    name: po-sales-order-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: LLM_PROVIDER
        value: mock            # set to "mistral" and add MISTRAL_API_KEY for live extraction
      - key: MISTRAL_API_KEY
        sync: false            # add your key in the dashboard; never commit it
      - key: MISTRAL_MODEL
        value: mistral-large-latest
      - key: ENABLE_OCR
        value: "false"
      - key: DB_PATH
        value: /var/data/sales.db
      - key: FRONTEND_ORIGIN
        sync: false            # set to your Vercel URL, e.g. https://your-app.vercel.app
    disk:
      name: sales-data
      mountPath: /var/data     # persistent disk so Sales Orders survive restarts
      sizeGB: 1
